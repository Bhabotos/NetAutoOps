# Serves the built SPA and reverse-proxies /api/* to the backend container,
# so the browser only ever talks to this origin -- same purpose as Vite's
# dev-server proxy (see vite.config.ts), meaning the app's fetch calls hit
# relative "/api/..." paths unchanged in both environments and the backend
# never needs CORS configured.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
